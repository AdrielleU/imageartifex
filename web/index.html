<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ImageArtifex</title>
  <link rel="icon" type="image/svg+xml" href="/web/icon.svg">
  <link rel="stylesheet" href="/web/style.css">
</head>
<body>
  <header class="menubar">
    <span class="brand"><img src="/web/icon.svg" alt="" width="18" height="18">ImageArtifex</span>
    <div class="menu"><span>File</span><div class="dropdown">
      <button data-cmd="new-project">New project…</button>
      <button data-cmd="open-project">Open project…</button>
      <button data-cmd="new">New canvas…</button>
      <button data-cmd="import">Import images / PSD / XCF…</button>
      <button data-cmd="export-png">Export PNG</button>
      <button data-cmd="export-jpeg">Export JPEG</button>
      <button data-cmd="export-webp">Export WebP</button>
      <button data-cmd="export-psd">Export PSD (layers)</button>
      <button data-cmd="export-xcf">Export XCF (GIMP)</button>
      <button data-cmd="export-pdf">Export PDF</button>
      <button data-cmd="export-svg">Export SVG</button>
    </div></div>
    <div class="menu"><span>Edit</span><div class="dropdown">
      <button data-cmd="undo">Undo <kbd>Ctrl+Z</kbd></button>
      <button data-cmd="redo">Redo <kbd>Ctrl+Shift+Z</kbd></button>
      <button data-cmd="copy">Copy <kbd>Ctrl+C</kbd></button>
      <button data-cmd="copy-merged">Copy merged <kbd>Ctrl+Shift+C</kbd></button>
      <button data-cmd="paste">Paste <kbd>Ctrl+V</kbd></button>
      <button data-cmd="paste-in-place">Paste in place <kbd>Ctrl+Shift+V</kbd></button>
      <button data-cmd="clear">Clear selection area <kbd>Del</kbd></button>
      <button data-cmd="fill">Fill with foreground color</button>
      <button data-cmd="stroke-selection">Stroke selection…</button>
      <button data-cmd="stroke-path">Stroke path</button>
      <button data-cmd="fill-path">Fill path</button>
    </div></div>
    <div class="menu"><span>Image</span><div class="dropdown">
      <button data-cmd="image-size">Image size…</button>
      <button data-cmd="canvas-size">Canvas size…</button>
      <button data-cmd="background">Background color…</button>
      <button data-cmd="crop-selection">Crop to selection</button>
      <button data-cmd="flatten">Flatten image</button>
    </div></div>
    <div class="menu"><span>Select</span><div class="dropdown">
      <button data-cmd="select-all">All <kbd>Ctrl+A</kbd></button>
      <button data-cmd="select-none">None <kbd>Ctrl+Shift+A</kbd></button>
      <button data-cmd="select-invert">Invert <kbd>Ctrl+I</kbd></button>
      <button data-cmd="select-by-color">By color (tool)</button>
      <button data-cmd="select-alpha">From layer alpha</button>
      <button data-cmd="select-path">From path</button>
      <button data-cmd="tool-scissors">Intelligent scissors <kbd>Shift+L</kbd></button>
      <button data-cmd="tool-fgselect">Foreground select <kbd>Shift+F</kbd></button>
      <button data-cmd="transform-selection">Transform outline</button>
      <button data-cmd="save-selection">Save selection…</button>
      <button data-cmd="load-selection">Load selection…</button>
      <button data-cmd="select-feather">Feather…</button>
      <button data-cmd="select-grow">Grow…</button>
      <button data-cmd="select-shrink">Shrink…</button>
      <button data-cmd="select-border">Border…</button>
    </div></div>
    <div class="menu"><span>Layer</span><div class="dropdown">
      <button data-cmd="new-adjustment">New adjustment layer</button>
      <button data-cmd="group">Group layer <kbd>Ctrl+G</kbd></button>
      <button data-cmd="ungroup">Ungroup <kbd>Ctrl+Shift+G</kbd></button>
      <button data-cmd="toggle-clip">Clipping mask <kbd>Ctrl+Alt+G</kbd></button>
      <button data-cmd="new-paint">New paint layer</button>
      <button data-cmd="duplicate">Duplicate layer <kbd>Ctrl+J</kbd></button>
      <button data-cmd="copy-layer">New layer via copy <kbd>Ctrl+J</kbd></button>
      <button data-cmd="cut-layer">New layer via cut <kbd>Ctrl+Shift+J</kbd></button>
      <button data-cmd="mask">Add mask from selection</button>
      <button data-cmd="unmask">Remove layer mask</button>
      <button data-cmd="merge-down">Merge down <kbd>Ctrl+E</kbd></button>
      <button data-cmd="fit">Scale to fit canvas</button>
      <button data-cmd="flip-h">Flip horizontally</button>
      <button data-cmd="flip-v">Flip vertically</button>
      <button data-cmd="rotate-90">Rotate 90° clockwise</button>
      <button data-cmd="delete">Delete layer <kbd>Del</kbd></button>
    </div></div>
    <div class="menu"><span>Colors</span><div class="dropdown">
      <button data-cmd="levels">Levels…</button>
      <button data-cmd="curves">Curves…</button>
      <button data-cmd="auto-levels">Auto levels</button>
      <button data-cmd="balance">Color balance…</button>
      <button data-cmd="threshold">Threshold…</button>
      <button data-cmd="posterize">Posterize…</button>
      <button data-cmd="shadows-highlights">Shadows-highlights…</button>
      <button data-cmd="exposure">Exposure…</button>
      <button data-cmd="hue-chroma">Hue-chroma…</button>
      <button data-cmd="color-to-alpha">Color to alpha…</button>
      <button data-cmd="desaturate">Desaturate</button>
      <button data-cmd="invert">Invert</button>
      <button data-cmd="sepia">Sepia</button>
      <button data-cmd="reset-colors">Reset all adjustments</button>
    </div></div>
    <div class="menu"><span>Filters</span><div class="dropdown">
      <button data-cmd="blur">Gaussian blur…</button>
      <button data-cmd="unsharp">Unsharp mask (sharpen)…</button>
      <button data-cmd="denoise">Noise reduction…</button>
      <button data-cmd="high-pass">High pass…</button>
      <button data-cmd="distort">Distort (twirl, pinch, ripple, waves)…</button>
      <button data-cmd="liquify">Liquify</button>
      <button data-cmd="lens">Lens distortion…</button>
      <button data-cmd="pixelate">Pixelate…</button>
      <button data-cmd="emboss">Emboss…</button>
      <button data-cmd="drop-shadow">Drop shadow</button>
    </div></div>
    <div class="menu"><span>View</span><div class="dropdown">
      <button data-cmd="toggle-theme"><span id="theme-label">Light mode</span></button>
      <button data-cmd="toggle-panels">Hide panels <kbd>Shift+Tab</kbd></button>
      <button data-cmd="toggle-toolbar">Two-column toolbar</button>
      <button data-cmd="toggle-rulers"><span id="rulers-label">Hide rulers</span> <kbd>Ctrl+R</kbd></button>
      <button data-cmd="toggle-grid"><span id="grid-label">Show grid</span> <kbd>Ctrl+'</kbd></button>
      <button data-cmd="grid-size">Grid size…</button>
      <button data-cmd="toggle-snap"><span id="snap-label">Turn snapping off</span> <kbd>Ctrl+;</kbd></button>
      <button data-cmd="clear-guides">Clear guides</button>
    </div></div>
    <span id="status"></span>
    <span id="gpu-badge"></span>
    <button id="theme-toggle" title="Switch to light mode"></button>
  </header>

  <div class="optionsbar" id="options"></div>

  <main>
    <nav class="tools" id="tools">
      <button id="tools-toggle" class="tools-toggle" title="Expand toolbar to two columns"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l6 6-6 6M13 6l6 6-6 6"/></svg></button>
      <div class="tool-grid">
      <button data-tool="move" title="Move (V)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M2 12h20M12 2l-3 3M12 2l3 3M12 22l-3-3M12 22l3-3M2 12l3-3M2 12l3 3M22 12l-3-3M22 12l-3 3"/></svg></button>
      <button data-tool="crop" title="Crop (C)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v16h16"/><path d="M2 6h16v16"/></svg></button>
      <button data-tool="rselect" title="Rectangle select (M)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="14" stroke-dasharray="3 2.5"/></svg></button>
      <button data-tool="eselect" title="Ellipse select (Shift+M)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="12" rx="9" ry="7" stroke-dasharray="3 2.5"/></svg></button>
      <button data-tool="lasso" title="Free select / lasso (L)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18c-3-2-4-5-2-8s7-5 11-3 4 6 0 8-7 1-8-1" stroke-dasharray="3 2.5"/><path d="M7 18l-1 3"/></svg></button>
      <button data-tool="wand" title="Fuzzy select / magic wand (W)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20L15 9"/><path d="M15 3v3M19 5l-2 2M21 9h-3M18 13l-2-2"/></svg></button>
      <button data-tool="scissors" title="Intelligent scissors (Shift+L) — click around the object; the outline snaps to edges"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4L8.1 15.9M14.5 14.5L20 20M8.1 8.1L12 12"/></svg></button>
      <button data-tool="fgselect" title="Foreground select (Shift+F) — rough outline, paint the object, Enter"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7c3-4 13-4 16 0s-3 12-8 12S1 11 4 7z" stroke-dasharray="3 2.5"/><circle cx="12" cy="11" r="3" fill="currentColor"/></svg></button>
      <hr class="tool-sep">
      <button data-tool="brush" title="Brush (B)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 3l3 3-9 9-3-3z"/><path d="M9 12c-3 0-5 2-5 5 0 1-1 2-2 2 2 2 7 2 9-1 1-2 1-4-2-6z"/></svg></button>
      <button data-tool="eraser" title="Eraser (E)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 21h13"/><path d="M3 15l9-9 7 7-6 6H8z"/><path d="M9 9l7 7"/></svg></button>
      <button data-tool="bucket" title="Bucket fill (Shift+G)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11l7-7 7 7-7 7z"/><path d="M19 15c1 2 2 3 2 4a2 2 0 01-4 0c0-1 1-2 2-4z"/></svg></button>
      <button data-tool="gradient" title="Gradient (G)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><defs><linearGradient id="gi"><stop offset="0" stop-color="currentColor"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs><rect x="3" y="5" width="18" height="14" rx="1" fill="url(#gi)"/></svg></button>
      <hr class="tool-sep">
      <button data-tool="clone" title="Clone (S) — Alt/Ctrl-click sets the source"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6v5H9z"/><path d="M12 9v3"/><path d="M5 12h14v3H5z"/><path d="M7 15v5h10v-5"/></svg></button>
      <button data-tool="heal" title="Heal (J) — Alt/Ctrl-click sets the source"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="8" rx="4" transform="rotate(-45 12 12)"/><path d="M10 12h.01M12 10h.01M12 14h.01M14 12h.01"/></svg></button>
      <button data-tool="smudge" title="Smudge (R)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V5a1.5 1.5 0 013 0v5"/><path d="M12 10V4a1.5 1.5 0 013 0v6"/><path d="M15 10V6a1.5 1.5 0 013 0v7a6 6 0 01-6 6h-1a6 6 0 01-5-3l-2-4a1.5 1.5 0 012.5-1.5L9 13"/></svg></button>
      <button data-tool="blur" title="Blur / Sharpen (Shift+R) — Alt switches blur ↔ sharpen"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c3 4 6 7.5 6 11a6 6 0 01-12 0c0-3.5 3-7 6-11z"/></svg></button>
      <button data-tool="liquify" title="Liquify — push, twirl, bloat, pinch (Filters → Liquify)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8c3-3 6 3 9 0s6-3 9 0"/><path d="M3 16c3-3 6 3 9 0s6-3 9 0"/></svg></button>
      <button data-tool="dodge" title="Dodge / Burn (Shift+D) — Alt switches dodge ↔ burn"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="5"/><path d="M12.5 12.5L20 20"/></svg></button>
      <hr class="tool-sep">
      <button data-tool="pen" title="Pen / paths (P) — click for corners, drag for curves, click the first point to close, Enter to finish"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18z"/><path d="M2 2l7.6 7.6"/><circle cx="11" cy="11" r="2"/></svg></button>
      <button data-tool="text" title="Text (T)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14M12 5v15M9 20h6"/></svg></button>
      <button data-tool="rect" title="Rectangle (U)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="6" width="16" height="12" rx="1"/></svg></button>
      <button data-tool="ellipse" title="Ellipse (O)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="12" rx="9" ry="7"/></svg></button>
      <hr class="tool-sep">
      <button data-tool="picker" title="Color picker (I)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4l6 6-2 2-6-6z"/><path d="M13 7l-9 9v4h4l9-9"/></svg></button>
      </div>
      <div class="swatches">
        <input type="color" id="color" title="Foreground color" value="#e11d48">
        <input type="color" id="bgcolor" title="Background color" value="#ffffff">
        <button id="swap" title="Swap colors (X)">⇄</button>
      </div>
    </nav>
    <div class="workspace" id="workspace">
      <div class="ruler-corner"></div><canvas id="ruler-x" class="ruler" title="Drag down to add a horizontal guide"></canvas>
      <canvas id="ruler-y" class="ruler" title="Drag right to add a vertical guide"></canvas>
      <section class="viewport" id="viewport">
        <div class="stage" id="stage"><canvas id="canvas"></canvas><canvas id="ants"></canvas></div>
      </section>
    </div>
    <aside class="panels">
      <div class="panels-head">
        <button id="panels-toggle" class="panels-toggle" title="Hide panels (Shift+Tab)"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l6 6-6 6M13 6l6 6-6 6"/></svg></button>
      </div>
      <nav class="panels-tabs">
        <button data-panel="panel-props">Properties</button>
        <button data-panel="panel-layers">Layers</button>
        <button data-panel="panel-paths">Paths</button>
        <button data-panel="panel-channels">Channels</button>
        <button data-panel="panel-history">History</button>
      </nav>
      <section class="panel" id="panel-props"><h3>Properties</h3><div id="props"></div></section>
      <section class="panel" id="panel-layers"><h3>Layers</h3><div id="layers"></div><div class="row" id="layer-actions"></div></section>
      <section class="panel" id="panel-paths"><h3>Paths</h3><div id="paths"></div></section>
      <section class="panel" id="panel-channels"><h3>Channels <small>saved selections</small></h3><div id="channels"></div></section>
      <section class="panel grow" id="panel-history"><h3>History <small>plain-English log of every change</small></h3><div id="history"></div></section>
    </aside>
  </main>
  <input type="file" id="file" accept="image/*,.psd,.xcf" multiple hidden>
  <script type="module" src="/web/app.js"></script>
</body>
</html>
